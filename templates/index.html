<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
</head>
<body>
    <h1>My Todo List</h1>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }}
                {% if task.completed %}
                    - Completed
                {% else %}
                    - Pending
                {% endif %}
            </li>
        {% else %}
            <li>No tasks yet. Add your first task soon!</li>
        {% endfor %}
    </ul>
</body>
</html>
