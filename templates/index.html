<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
</head>
<body>
    <h1>My Todo List</h1>

    <form action="{{ url_for('add_task') }}" method="POST">
        <input
            type="text"
            name="title"
            placeholder="Enter a new task..."
            maxlength="200"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>


                {% if task.completed %}
                    <s>{{ task.title }}</s>
                    - Completed
                {% else %}
                    {{ task.title }}
                    - Pending
                {% endif %}

                <form action="{{ url_for('complete_task', task_id=task.id) }}"
                        method="POST"
                        style="display: inline;">
                    <button type="submit">
                        {% if task.completed %}
                            Undo
                        {% else %}
                            Done
                        {% endif %}
                    </button>
                </form>
                <form action="{{ url_for('delete_task', task_id=task.id) }}"
                      method="POST"
                      style="display: inline;">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% else %}
            <li>No tasks yet. Add your first task!</li>
        {% endfor %}
    </ul>
</body>
</html>
